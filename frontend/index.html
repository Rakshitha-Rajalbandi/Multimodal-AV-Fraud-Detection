<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimodal Audio-Video Fraud & Deepfake Detection Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .gradient-text { background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .pulse-glow { animation: pulse-glow-anim 2s infinite alternate; }
    @keyframes pulse-glow-anim { 0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); } 100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.8); } }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Auth State
      const [user, setUser] = useState(() => {
        const saved = sessionStorage.getItem('forensic_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState(null);
      const [loginLoading, setLoginLoading] = useState(false);

      // App Workspace State
      const [activeTab, setActiveTab] = useState('analysis'); // 'analysis' | 'history'
      const [uploadedFile, setUploadedFile] = useState(null);
      const [videoPreviewUrl, setVideoPreviewUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      const [currentRequestId, setCurrentRequestId] = useState(null);
      const [currentFilename, setCurrentFilename] = useState(null);
      const [error, setError] = useState(null);
      const [analystDecision, setAnalystDecision] = useState(null);

      // History & Audit Records State
      const [historyRecords, setHistoryRecords] = useState([]);
      const [historyDbEngine, setHistoryDbEngine] = useState('MYSQL');
      const [historyFilter, setHistoryFilter] = useState('ALL'); // 'ALL' | 'APPROVED' | 'AUDIT' | 'REJECTED'
      const [searchQuery, setSearchQuery] = useState('');

      const fetchHistory = () => {
        fetch('/audit_trail')
          .then(res => res.json())
          .then(data => {
            if (data.audit_trail) {
              setHistoryRecords(data.audit_trail);
              setHistoryDbEngine(data.database_engine || 'MYSQL');
            }
          })
          .catch(err => console.log('Audit trail fetch notice', err));
      };

      useEffect(() => {
        if (user) {
          fetchHistory();
        }
      }, [user]);

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoginLoading(true);
        setLoginError(null);

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: loginUsername, password: loginPassword })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Authentication failed.');

          setUser(data.user);
          sessionStorage.setItem('forensic_user', JSON.stringify(data.user));
          fetchHistory();
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = () => {
        setUser(null);
        sessionStorage.removeItem('forensic_user');
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          setUploadedFile(file);
          setVideoPreviewUrl(URL.createObjectURL(file));
          setAnalysisResult(null);
          setCurrentRequestId(null);
          setCurrentFilename(null);
          setError(null);
          setAnalystDecision(null);
        }
      };

      const executeAnalysis = async () => {
        if (!uploadedFile) {
          setError("Please select or drop a video file to analyze.");
          return;
        }

        setLoading(true);
        setError(null);
        setAnalysisResult(null);
        setAnalystDecision(null);

        try {
          const formData = new FormData();
          formData.append('video', uploadedFile);
          const response = await fetch('/predict', { method: 'POST', body: formData });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error || 'Analysis request failed.');
          }

          const resData = await response.json();
          setAnalysisResult(resData.results);
          setCurrentRequestId(resData.request_id);
          setCurrentFilename(resData.filename);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const recordDecision = async (decisionText) => {
        setAnalystDecision(decisionText);
        try {
          await fetch('/record_decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              decision: decisionText,
              request_id: currentRequestId || 'N/A',
              filename: currentFilename || uploadedFile?.name || 'N/A',
              fraud_risk_percent: analysisResult ? analysisResult.fraud_risk_percent : 0,
              prediction: analysisResult ? analysisResult.prediction : 'N/A',
              trigger_modality: analysisResult ? analysisResult.trigger_modality : 'N/A'
            })
          });
          fetchHistory();
        } catch (err) {
          console.log('Record decision error', err);
        }
      };

      // Filtered records for History view
      const filteredRecords = historyRecords.filter(rec => {
        const dec = (rec.analyst_decision || rec.decision || '').toUpperCase();
        const fname = (rec.filename || '').toLowerCase();
        const reqId = (rec.request_id || '').toLowerCase();
        const q = searchQuery.toLowerCase();

        const matchesSearch = fname.includes(q) || reqId.includes(q);

        if (historyFilter === 'APPROVED') {
          return matchesSearch && dec.includes('APPROV');
        } else if (historyFilter === 'AUDIT') {
          return matchesSearch && (dec.includes('AUDIT') || dec.includes('FLAG'));
        } else if (historyFilter === 'REJECTED') {
          return matchesSearch && dec.includes('REJECT');
        }
        return matchesSearch;
      });

      const approvedCount = historyRecords.filter(r => (r.analyst_decision || r.decision || '').toUpperCase().includes('APPROV')).length;
      const auditCount = historyRecords.filter(r => (r.analyst_decision || r.decision || '').toUpperCase().includes('AUDIT') || (r.analyst_decision || r.decision || '').toUpperCase().includes('FLAG')).length;
      const rejectedCount = historyRecords.filter(r => (r.analyst_decision || r.decision || '').toUpperCase().includes('REJECT')).length;

      // Render Login Screen if not authenticated
      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center px-4 py-12">
            <div class="glass-card rounded-3xl p-8 md:p-10 max-w-md w-full space-y-6 shadow-2xl border border-slate-700/60">
              
              <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-2xl bg-indigo-500/20 text-indigo-400 mx-auto flex items-center justify-center border border-indigo-500/30">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-black gradient-text mt-3">Forensic Security Portal</h1>
              </div>

              <form onSubmit={handleLogin} class="space-y-4">
                <div>
                  <label class="text-xs font-bold text-slate-300 block mb-1 uppercase tracking-wider">Username</label>
                  <input 
                    type="text" 
                    value={loginUsername}
                    onChange={(e) => setLoginUsername(e.target.value)}
                    required
                    class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition"
                    placeholder="e.g. analyst or admin"
                  />
                </div>

                <div>
                  <label class="text-xs font-bold text-slate-300 block mb-1 uppercase tracking-wider">Password</label>
                  <input 
                    type="password" 
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    required
                    class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition"
                    placeholder="Enter password"
                  />
                </div>

                {loginError && (
                  <div class="p-3 bg-rose-500/15 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-semibold text-center">
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={loginLoading}
                  class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm"
                >
                  {loginLoading ? 'Authenticating...' : 'Sign In to Portal'}
                </button>
              </form>

            </div>
          </div>
        );
      }

      return (
        <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
          
          {/* Main Top Header */}
          <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
            <div>
              <div class="flex items-center gap-3">
                <span class="px-3 py-1 bg-indigo-500/20 text-indigo-400 text-xs font-bold rounded-full uppercase tracking-wider border border-indigo-500/30">
                  AI Forensic Security & Identity Verification
                </span>
                <span class="flex items-center gap-1 text-xs text-emerald-400 font-medium">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> MySQL DB Active ({historyDbEngine})
                </span>
              </div>
              <h1 class="text-3xl font-extrabold tracking-tight mt-2 gradient-text">
                Multimodal Audio-Video Fraud & Deepfake Detection Platform
              </h1>
            </div>

            <div class="flex items-center gap-3">
              <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-800/80 border border-slate-700 rounded-xl text-xs">
                <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white uppercase text-xs">
                  {user.username.charAt(0)}
                </div>
                <div class="text-left">
                  <span class="font-bold text-slate-200 block">{user.username}</span>
                  <span class="text-[10px] text-slate-400 block">{user.role}</span>
                </div>
              </div>

              <button 
                onClick={handleLogout}
                class="px-3 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-semibold rounded-xl border border-rose-500/30 transition"
              >
                Sign Out
              </button>
            </div>
          </header>

          {/* Navigation Bar / Tabs */}
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center gap-3">
              <button
                onClick={() => setActiveTab('analysis')}
                class={`px-5 py-2.5 rounded-xl font-bold text-xs tracking-wider uppercase transition flex items-center gap-2 ${activeTab === 'analysis' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                🔍 Live Video Fraud Analysis
              </button>

              <button
                onClick={() => { setActiveTab('history'); fetchHistory(); }}
                class={`px-5 py-2.5 rounded-xl font-bold text-xs tracking-wider uppercase transition flex items-center gap-2 ${activeTab === 'history' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 01-2-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                📋 Verification Audit History ({historyRecords.length})
              </button>
            </div>
          </div>

          {/* TAB 1: Live Video Analysis Workspace */}
          {activeTab === 'analysis' && (
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              {/* Left Column: Video Upload Panel */}
              <div class="lg:col-span-5 space-y-6">
                
                <div class="glass-card rounded-2xl p-6 space-y-6">
                  <div>
                    <h2 class="text-lg font-bold flex items-center gap-2 text-slate-200">
                      <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                      Upload Video for Forensic Analysis
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">
                      Upload any video recording (.mp4, .avi, .mov) to evaluate tri-modality deepfake cues.
                    </p>
                  </div>
                  
                  {/* File Dropzone */}
                  <label class={`border-2 border-dashed rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer transition min-h-[220px] ${uploadedFile ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700 hover:border-indigo-500 hover:bg-slate-800/50'}`}>
                    <input type="file" accept="video/*" class="hidden" onChange={handleFileChange} />
                    
                    {uploadedFile ? (
                      <div class="flex flex-col items-center space-y-3">
                        <div class="w-12 h-12 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400">
                          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="text-center">
                          <span class="text-sm font-bold text-indigo-300 block">{uploadedFile.name}</span>
                          <span class="text-xs text-slate-400 mt-0.5 block">{(uploadedFile.size / (1024 * 1024)).toFixed(2)} MB</span>
                          <span class="text-xs text-emerald-400 font-bold mt-2 inline-block px-2.5 py-1 bg-emerald-500/20 border border-emerald-500/30 rounded-md">
                            ✓ File Ready for ML Analysis
                          </span>
                        </div>
                      </div>
                    ) : (
                      <div class="flex flex-col items-center text-center space-y-3">
                        <div class="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center text-slate-400">
                          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <div>
                          <span class="text-sm font-semibold text-slate-200 block">Drag and drop video file here</span>
                          <span class="text-xs text-slate-400 mt-1 block">or click to browse from your computer</span>
                        </div>
                        <span class="text-[11px] text-slate-500">Supports .mp4, .avi, .mov, .webm</span>
                      </div>
                    )}
                  </label>

                  {/* Video Player Preview */}
                  {videoPreviewUrl && (
                    <div class="rounded-xl overflow-hidden border border-slate-800 bg-black">
                      <video src={videoPreviewUrl} controls class="w-full max-h-48 object-contain"></video>
                    </div>
                  )}

                  {/* Action Button */}
                  <button
                    onClick={executeAnalysis}
                    disabled={loading || !uploadedFile}
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base"
                  >
                    {loading ? (
                      <>
                        <svg class="animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Evaluating Tri-Modality Signals...
                      </>
                    ) : (
                      <>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Run Fraud Analysis
                      </>
                    )}
                  </button>

                  {error && (
                    <div class="p-4 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs">
                      <strong>Analysis Error:</strong> {error}
                    </div>
                  )}
                </div>

              </div>

              {/* Right Display Column: Risk Score Gauge & Modality Breakdown */}
              <div class="lg:col-span-7 space-y-6">
                
                {analysisResult ? (
                  <>
                    {/* Executive Risk Score Card */}
                    <div class={`glass-card rounded-2xl p-6 relative overflow-hidden ${analysisResult.prediction === 'FAKE' ? 'border-rose-500/40 pulse-glow' : 'border-emerald-500/40'}`}>
                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                        
                        {/* Risk Score Circle Gauge */}
                        <div class="flex items-center gap-6">
                          <div class="relative w-28 h-28 flex items-center justify-center">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                              <path class="text-slate-800" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                              <path class={analysisResult.prediction === 'FAKE' ? 'text-rose-500' : 'text-emerald-400'} stroke-dasharray={`${analysisResult.fraud_risk_percent}, 100`} stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <div class="absolute flex flex-col items-center">
                              <span class="text-2xl font-black">{analysisResult.fraud_risk_percent}%</span>
                              <span class="text-[9px] uppercase font-bold tracking-wider text-slate-400">Fraud Risk</span>
                            </div>
                          </div>

                          <div>
                            <div class="flex items-center gap-2">
                              <span class={`text-sm font-black px-3 py-1 rounded-md uppercase tracking-wide ${analysisResult.prediction === 'FAKE' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'}`}>
                                {analysisResult.risk_level} FRAUD RISK ({analysisResult.prediction})
                              </span>
                            </div>
                            <p class="text-xs text-slate-300 font-semibold mt-2">
                              Confidence Level: <span class="text-indigo-400 font-bold">{analysisResult.confidence}</span>
                            </p>
                            <p class="text-xs text-slate-400 mt-1">
                              Flagged Cue: <span class="text-slate-200 font-medium">{analysisResult.trigger_modality}</span>
                            </p>
                          </div>
                        </div>

                      </div>
                    </div>

                    {/* Tri-Modality Breakdown Cards */}
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                      
                      {/* Card 1: Video CNN */}
                      <div class="glass-card rounded-2xl p-5 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">1. Visual Authenticity</span>
                          <span class="text-xs font-extrabold text-indigo-400">{analysisResult.video.visual_score_percent}% Fake</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                          <div class="bg-indigo-500 h-full transition-all" style={{ width: `${analysisResult.video.visual_score_percent}%` }}></div>
                        </div>
                        <p class="text-xs text-slate-400">
                          EfficientNet-B0 visual classifier evaluating {analysisResult.video.frames_evaluated} temporal face frames.
                        </p>
                      </div>

                      {/* Card 2: Audio Spectrogram */}
                      <div class="glass-card rounded-2xl p-5 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">2. Speech Authenticity</span>
                          <span class="text-xs font-extrabold text-purple-400">{analysisResult.audio.audio_score_percent}% Synthetic</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                          <div class="bg-purple-500 h-full transition-all" style={{ width: `${analysisResult.audio.audio_score_percent}%` }}></div>
                        </div>
                        <p class="text-xs text-slate-400">
                          2D-CNN Spectrogram classifier scoring voice cloning & speech synthesis acoustic cues.
                        </p>
                      </div>

                      {/* Card 3: Lip-Sync Mismatch */}
                      <div class="glass-card rounded-2xl p-5 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">3. Lip-Sync Mismatch</span>
                          <span class="text-xs font-extrabold text-amber-400">{(analysisResult.sync.sync_mismatch_score * 100).toFixed(1)}% Mismatch</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                          <div class="bg-amber-500 h-full transition-all" style={{ width: `${analysisResult.sync.sync_mismatch_score * 100}%` }}></div>
                        </div>
                        <p class="text-xs text-slate-400">
                          Cross-modal timing correlation between lip opening motion & speech energy envelope.
                        </p>
                      </div>

                    </div>

                    {/* Forensic Analyst Decision Panel */}
                    <div class="glass-card rounded-2xl p-6 space-y-4">
                      <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        Forensic Review & Verification Action
                      </h3>

                      {analystDecision ? (
                        <div class="p-4 bg-emerald-500/20 border border-emerald-500/40 rounded-xl text-center space-y-1">
                          <span class="text-sm font-bold text-emerald-300 block">✓ Decision Recorded: {analystDecision}</span>
                          <span class="text-xs text-slate-400 block">Saved to MySQL database (`verification_history` table)</span>
                        </div>
                      ) : (
                        <div class="grid grid-cols-3 gap-3">
                          <button 
                            onClick={() => recordDecision('APPROVED (AUTHENTIC)')}
                            class="py-3 bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 border border-emerald-500/40 rounded-xl font-semibold text-xs transition"
                          >
                            Approve Verification
                          </button>
                          <button 
                            onClick={() => recordDecision('FLAGGED FOR DEEPFAKE AUDIT')}
                            class="py-3 bg-amber-600/30 hover:bg-amber-600/50 text-amber-300 border border-amber-500/40 rounded-xl font-semibold text-xs transition"
                          >
                            Flag for Deepfake Audit
                          </button>
                          <button 
                            onClick={() => recordDecision('REJECTED (FRAUD)')}
                            class="py-3 bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 border border-rose-500/40 rounded-xl font-semibold text-xs transition"
                          >
                            Reject Fraud Attempt
                          </button>
                        </div>
                      )}
                    </div>
                  </>
                ) : (
                  /* Placeholder when no video analyzed yet */
                  <div class="glass-card rounded-2xl p-12 text-center flex flex-col items-center justify-center space-y-4 min-h-[400px]">
                    <div class="w-16 h-16 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-200">No Video Uploaded Yet</h3>
                    <p class="text-xs text-slate-400 max-w-md">
                      Upload any video recording on the left panel to run full multimodal ML detection and view real-time fraud risk results.
                    </p>
                  </div>
                )}

              </div>

            </div>
          )}

          {/* TAB 2: Verification History & Audit Records Workspace */}
          {activeTab === 'history' && (
            <div class="space-y-6">
              
              {/* Category Summary Cards */}
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div class="glass-card rounded-2xl p-5 border border-slate-700/60">
                  <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Total Audited Videos</span>
                  <span class="text-2xl font-black text-slate-100 mt-1 block">{historyRecords.length}</span>
                  <span class="text-[10px] text-indigo-400 mt-1 block font-semibold">Engine: {historyDbEngine} DB</span>
                </div>

                <div class="glass-card rounded-2xl p-5 border border-emerald-500/30 bg-emerald-500/5">
                  <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block">Approved Verification</span>
                  <span class="text-2xl font-black text-emerald-300 mt-1 block">{approvedCount}</span>
                  <span class="text-[10px] text-emerald-400/80 mt-1 block">Authentic Video Calls</span>
                </div>

                <div class="glass-card rounded-2xl p-5 border border-amber-500/30 bg-amber-500/5">
                  <span class="text-xs font-bold text-amber-400 uppercase tracking-wider block">Sent for Manual Audit</span>
                  <span class="text-2xl font-black text-amber-300 mt-1 block">{auditCount}</span>
                  <span class="text-[10px] text-amber-400/80 mt-1 block">Flagged Borderline Cues</span>
                </div>

                <div class="glass-card rounded-2xl p-5 border border-rose-500/30 bg-rose-500/5">
                  <span class="text-xs font-bold text-rose-400 uppercase tracking-wider block">Rejected Fraud Attempts</span>
                  <span class="text-2xl font-black text-rose-300 mt-1 block">{rejectedCount}</span>
                  <span class="text-[10px] text-rose-400/80 mt-1 block">Blocked Deepfake Scams</span>
                </div>
              </div>

              {/* Controls & Filter Bar */}
              <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                
                {/* Status Filter Buttons */}
                <div class="flex items-center gap-2">
                  <button
                    onClick={() => setHistoryFilter('ALL')}
                    class={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                  >
                    All ({historyRecords.length})
                  </button>

                  <button
                    onClick={() => setHistoryFilter('APPROVED')}
                    class={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'APPROVED' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                  >
                    🟢 Approved ({approvedCount})
                  </button>

                  <button
                    onClick={() => setHistoryFilter('AUDIT')}
                    class={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'AUDIT' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                  >
                    🟡 Sent for Audit ({auditCount})
                  </button>

                  <button
                    onClick={() => setHistoryFilter('REJECTED')}
                    class={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'REJECTED' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                  >
                    🔴 Rejected ({rejectedCount})
                  </button>
                </div>

                {/* Search Box */}
                <div class="relative w-full sm:w-64">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search filename or request ID..."
                    class="w-full pl-9 pr-4 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                  />
                  <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 9 0 0114 0z"></path></svg>
                </div>

              </div>

              {/* Records Table */}
              <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
                {filteredRecords.length > 0 ? (
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                      <thead class="bg-slate-900/90 uppercase tracking-wider text-[10px] text-slate-400 border-b border-slate-800">
                        <tr>
                          <th class="py-3.5 px-4 font-bold">Timestamp</th>
                          <th class="py-3.5 px-4 font-bold">Video File</th>
                          <th class="py-3.5 px-4 font-bold">Fraud Risk</th>
                          <th class="py-3.5 px-4 font-bold">AI Prediction</th>
                          <th class="py-3.5 px-4 font-bold">Flagged Modality</th>
                          <th class="py-3.5 px-4 font-bold">Analyst Verification Decision</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800/80">
                        {filteredRecords.map((rec, idx) => {
                          const decision = rec.analyst_decision || rec.decision || 'N/A';
                          const isApprove = decision.toUpperCase().includes('APPROV');
                          const isAudit = decision.toUpperCase().includes('AUDIT') || decision.toUpperCase().includes('FLAG');
                          const isReject = decision.toUpperCase().includes('REJECT');

                          return (
                            <tr key={idx} class="hover:bg-slate-800/40 transition">
                              <td class="py-3.5 px-4 font-mono text-[11px] text-slate-400">
                                {new Date(rec.timestamp).toLocaleString()}
                              </td>
                              
                              <td class="py-3.5 px-4 font-semibold text-slate-200">
                                {rec.filename}
                                <span class="block text-[10px] font-mono text-slate-500 mt-0.5">{rec.request_id}</span>
                              </td>

                              <td class="py-3.5 px-4 font-black">
                                <span class={`px-2 py-0.5 rounded text-[11px] ${rec.fraud_risk_percent > 60 ? 'text-rose-400 bg-rose-500/10' : rec.fraud_risk_percent > 30 ? 'text-amber-400 bg-amber-500/10' : 'text-emerald-400 bg-emerald-500/10'}`}>
                                  {rec.fraud_risk_percent}%
                                </span>
                              </td>

                              <td class="py-3.5 px-4 font-bold">
                                <span class={`px-2 py-0.5 rounded text-[10px] uppercase ${rec.prediction === 'FAKE' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}`}>
                                  {rec.prediction}
                                </span>
                              </td>

                              <td class="py-3.5 px-4 text-slate-400 max-w-xs truncate">
                                {rec.trigger_modality}
                              </td>

                              <td class="py-3.5 px-4">
                                <span class={`px-3 py-1 rounded-lg text-[11px] font-bold inline-block ${isApprove ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : isAudit ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : isReject ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-slate-800 text-slate-300'}`}>
                                  {decision}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div class="p-12 text-center space-y-3">
                    <p class="text-sm font-semibold text-slate-400">No verification records match your filter criteria.</p>
                    <p class="text-xs text-slate-500">Run a video fraud analysis on the main workspace and record a decision to populate history.</p>
                  </div>
                )}
              </div>

            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
