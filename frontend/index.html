<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> | Multimodal AI Verification</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      background-color: #f8fafc; 
      color: #0f172a; 
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }

    .white-card { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .btn-blue {
      background-color: #2563eb;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .btn-blue:hover {
      background-color: #1d4ed8;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .blue-gradient-text {
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Auth State
      const [user, setUser] = useState(() => {
        const saved = sessionStorage.getItem('forensic_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState(null);
      const [loginLoading, setLoginLoading] = useState(false);

      // Workspace State
      const [activeTab, setActiveTab] = useState('analysis'); // 'analysis' | 'history'
      const [inputMode, setInputMode] = useState('video'); // 'video' | 'image' | 'url' | 'webcam'
      
      const [uploadedFile, setUploadedFile] = useState(null);
      const [mediaPreviewUrl, setMediaPreviewUrl] = useState(null);
      const [mediaUrlInput, setMediaUrlInput] = useState('');
      
      // Live Webcam Stream State
      const [isWebcamActive, setIsWebcamActive] = useState(false);
      const [webcamError, setWebcamError] = useState(null);
      const [streamTimeline, setStreamTimeline] = useState([]);
      const [liveFaceBox, setLiveFaceBox] = useState(null);
      const [liveHeatmapUri, setLiveHeatmapUri] = useState(null);
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamIntervalRef = useRef(null);

      // Interactive Sensitivity Controls
      const [visualWeight, setVisualWeight] = useState(50);
      const [audioWeight, setAudioWeight] = useState(30);

      const [loading, setLoading] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      const [currentRequestId, setCurrentRequestId] = useState(null);
      const [currentFilename, setCurrentFilename] = useState(null);
      const [error, setError] = useState(null);
      const [analystDecision, setAnalystDecision] = useState(null);
      const [activeHoverPoint, setActiveHoverPoint] = useState(null);

      // History State
      const [historyRecords, setHistoryRecords] = useState([]);
      const [historyDbEngine, setHistoryDbEngine] = useState('MYSQL');
      const [historyFilter, setHistoryFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const fetchHistory = () => {
        fetch('/audit_trail')
          .then(res => res.json())
          .then(data => {
            if (data.audit_trail) {
              setHistoryRecords(data.audit_trail);
              setHistoryDbEngine(data.database_engine || 'MYSQL');
            }
          })
          .catch(err => console.log('Audit trail notice', err));
      };

      useEffect(() => {
        if (user) fetchHistory();
      }, [user]);

      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoginLoading(true);
        setLoginError(null);

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: loginUsername, password: loginPassword })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Authentication failed.');

          setUser(data.user);
          sessionStorage.setItem('forensic_user', JSON.stringify(data.user));
          fetchHistory();
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = () => {
        stopWebcamStream();
        setUser(null);
        sessionStorage.removeItem('forensic_user');
      };

      const stopWebcamStream = () => {
        if (streamIntervalRef.current) {
          clearInterval(streamIntervalRef.current);
          streamIntervalRef.current = null;
        }
        if (videoRef.current && videoRef.current.srcObject) {
          const tracks = videoRef.current.srcObject.getTracks();
          tracks.forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
        setIsWebcamActive(false);
      };

      const startWebcamStream = async () => {
        setWebcamError(null);
        setError(null);
        setStreamTimeline([]);
        setLiveFaceBox(null);
        setLiveHeatmapUri(null);

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
            audio: false
          });

          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }

          setIsWebcamActive(true);
          streamIntervalRef.current = setInterval(captureAndAnalyzeWebcamFrame, 900);
        } catch (err) {
          console.error("Webcam access error:", err);
          setWebcamError("Could not access camera device. Please ensure camera permission is granted.");
        }
      };

      const captureAndAnalyzeWebcamFrame = async () => {
        if (!videoRef.current || videoRef.current.paused || videoRef.current.ended) return;

        try {
          const v = videoRef.current;
          const canvas = canvasRef.current || document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 240;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

          const b64Data = canvas.toDataURL('image/jpeg', 0.65);

          const response = await fetch('/predict_stream_frame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: b64Data })
          });

          if (!response.ok) return;

          const data = await response.json();
          if (data.status === 'success') {
            setLiveFaceBox(data.bounding_box);
            if (data.heatmap_data_uri) setLiveHeatmapUri(data.heatmap_data_uri);

            const nowStr = new Date().toLocaleTimeString().split(' ')[0];
            const point = {
              timestamp_sec: Date.now() / 1000,
              timestamp_str: nowStr,
              risk_percent: data.fraud_risk_percent,
              prediction: data.prediction
            };

            setStreamTimeline(prev => {
              const updated = [...prev.slice(-19), point];
              
              setAnalysisResult({
                media_type: "Live Webcam Stream",
                fraud_risk_score: data.fake_probability,
                fraud_risk_percent: data.fraud_risk_percent,
                prediction: data.prediction,
                risk_level: data.risk_level,
                confidence: "HIGH",
                trigger_modality: data.prediction === 'FAKE' ? 'LIVE VISUAL FACIAL ANOMALY' : 'AUTHENTIC LIVE STREAM',
                ai_explanation: data.ai_explanation,
                video: {
                  prediction: data.prediction,
                  fake_probability: data.fake_probability,
                  real_probability: data.real_probability,
                  visual_score_percent: data.fraud_risk_percent,
                  frames_evaluated: 1,
                  heatmaps: data.heatmap_data_uri ? [{
                    data_uri: data.heatmap_data_uri,
                    label: "Live Grad-CAM Activation",
                    fake_prob: data.fake_probability
                  }] : []
                },
                audio: { prediction: "LIVE STREAM", fake_probability: 0.0, audio_score_percent: 0.0 },
                sync: { sync_mismatch_score: 0.0 },
                fusion: { fraud_risk_percent: data.fraud_risk_percent, prediction: data.prediction },
                heatmaps: data.heatmap_data_uri ? [{
                  data_uri: data.heatmap_data_uri,
                  label: "Live Grad-CAM Heatmap",
                  fake_prob: data.fake_probability
                }] : [],
                timeline_risk: updated,
                suspicious_timestamps: data.prediction === 'FAKE' ? [{
                  timestamp_str: `Live (${nowStr})`,
                  risk_percent: data.fraud_risk_percent,
                  description: "Real-time facial manipulation / landmark drift detected"
                }] : []
              });

              return updated;
            });

            if (!currentRequestId) {
              setCurrentRequestId(`stream_${Date.now().toString(36)}`);
              setCurrentFilename("Live_Webcam_Stream.mp4");
            }
          }
        } catch (err) {
          console.log("Webcam frame capture note:", err);
        }
      };

      useEffect(() => {
        return () => stopWebcamStream();
      }, []);

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          setUploadedFile(file);
          setMediaPreviewUrl(URL.createObjectURL(file));
          setAnalysisResult(null);
          setCurrentRequestId(null);
          setCurrentFilename(null);
          setError(null);
          setAnalystDecision(null);
        }
      };

      const executeAnalysis = async () => {
        setLoading(true);
        setError(null);
        setAnalysisResult(null);
        setAnalystDecision(null);

        try {
          let response;
          if (inputMode === 'url') {
            if (!mediaUrlInput.trim()) throw new Error("Please enter a valid media URL link.");
            response = await fetch('/predict_url', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: mediaUrlInput.trim() })
            });
          } else {
            if (!uploadedFile) throw new Error("Please select or drop a media file to analyze.");
            const formData = new FormData();
            formData.append('video', uploadedFile);
            response = await fetch('/predict', { method: 'POST', body: formData });
          }

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error || 'Analysis request failed.');
          }

          const resData = await response.json();
          setAnalysisResult(resData.results);
          setCurrentRequestId(resData.request_id);
          setCurrentFilename(resData.filename);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const recordDecision = async (decisionText) => {
        setAnalystDecision(decisionText);
        try {
          await fetch('/record_decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              decision: decisionText,
              request_id: currentRequestId || 'N/A',
              filename: currentFilename || uploadedFile?.name || 'N/A',
              fraud_risk_percent: analysisResult ? analysisResult.fraud_risk_percent : 0,
              prediction: analysisResult ? analysisResult.prediction : 'N/A',
              trigger_modality: analysisResult ? analysisResult.trigger_modality : 'N/A'
            })
          });
          fetchHistory();
        } catch (err) {
          console.log('Record decision error', err);
        }
      };

      const downloadPdfReport = () => {
        if (!currentRequestId) return;
        window.open(`/api/download_report/${currentRequestId}`, '_blank');
      };

      // Filtered records for History view
      const filteredRecords = historyRecords.filter(rec => {
        const dec = (rec.analyst_decision || rec.decision || '').toUpperCase();
        const fname = (rec.filename || '').toLowerCase();
        const reqId = (rec.request_id || '').toLowerCase();
        const q = searchQuery.toLowerCase();
        const matchesSearch = fname.includes(q) || reqId.includes(q);

        if (historyFilter === 'APPROVED') return matchesSearch && dec.includes('APPROV');
        if (historyFilter === 'AUDIT') return matchesSearch && (dec.includes('AUDIT') || dec.includes('FLAG'));
        if (historyFilter === 'REJECTED') return matchesSearch && dec.includes('REJECT');
        return matchesSearch;
      });

      const approvedCount = historyRecords.filter(r => (r.analyst_decision || r.decision || '').toUpperCase().includes('APPROV')).length;
      const auditCount = historyRecords.filter(r => (r.analyst_decision || r.decision || '').toUpperCase().includes('AUDIT') || (r.analyst_decision || r.decision || '').toUpperCase().includes('FLAG')).length;
      const rejectedCount = historyRecords.filter(r => (r.analyst_decision || r.decision || '').toUpperCase().includes('REJECT')).length;

      // Render Login Screen
      if (!user) {
        return (
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
            <div class="white-card p-8 md:p-10 max-w-md w-full space-y-6">
              <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 mx-auto flex items-center justify-center border border-blue-200">
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold blue-gradient-text mt-3">Deepfake Forensics Studio</h1>
                <p class="text-xs text-slate-500 font-medium">Multimodal Audio Video Fraud Detection Platform</p>
              </div>

              <form onSubmit={handleLogin} class="space-y-4 pt-2">
                <div>
                  <label class="text-xs font-bold text-slate-700 block mb-1.5 uppercase tracking-wider">Username</label>
                  <input 
                    type="text" 
                    value={loginUsername}
                    onChange={(e) => setLoginUsername(e.target.value)}
                    required
                    class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-blue-600 transition shadow-sm"
                    placeholder="e.g. analyst or admin"
                  />
                </div>

                <div>
                  <label class="text-xs font-bold text-slate-700 block mb-1.5 uppercase tracking-wider">Password</label>
                  <input 
                    type="password" 
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    required
                    class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-blue-600 transition shadow-sm"
                    placeholder="••••••••••••"
                  />
                </div>

                {loginError && (
                  <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-600 text-xs font-semibold text-center">
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={loginLoading}
                  class="w-full py-3.5 btn-blue font-bold rounded-xl text-sm shadow-md"
                >
                  {loginLoading ? 'Authenticating...' : 'Sign In to Portal'}
                </button>
              </form>

            </div>
          </div>
        );
      }

      return (
        <div class="flex-1 flex flex-col">
          
          {/* Top Header */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <div>
                  <span class="font-extrabold text-base text-slate-900 block leading-none">Multimodal Audio Video Fraud and Deepfake Detection</span>
                  
                </div>
              </div>

              <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button
                  onClick={() => setActiveTab('analysis')}
                  class={`px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 ${activeTab === 'analysis' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                  Forensic Workspace
                </button>

                <button
                  onClick={() => { setActiveTab('history'); fetchHistory(); }}
                  class={`px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 ${activeTab === 'history' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  Audit History ({historyRecords.length})
                </button>
              </div>

              <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-100 border border-slate-200 rounded-xl text-xs">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                  <span class="font-bold text-slate-800">{user.username}</span>
                </div>

                <button 
                  onClick={handleLogout}
                  class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl border border-slate-300 transition"
                >
                  Sign Out
                </button>
              </div>

            </div>
          </header>

          {/* Main Content */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">

            {/* TAB 1: Analysis Workspace */}
            {activeTab === 'analysis' && (
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* Left Column */}
                <div class="lg:col-span-5 space-y-6">
                  
                  <div class="white-card p-6 space-y-6">
                    <div class="border-b border-slate-200 pb-4">
                      <h2 class="text-base font-extrabold text-slate-900">Upload Evidence Media</h2>
                      <p class="text-xs text-slate-500 mt-1">Select video recording, static image, or direct media URL.</p>
                    </div>

                    <div class="grid grid-cols-4 gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                      <button
                        onClick={() => { stopWebcamStream(); setInputMode('video'); }}
                        class={`py-2 rounded-lg text-xs font-bold transition ${inputMode === 'video' ? 'bg-white text-blue-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}
                      >
                        🎬 Video
                      </button>

                      <button
                        onClick={() => { stopWebcamStream(); setInputMode('image'); }}
                        class={`py-2 rounded-lg text-xs font-bold transition ${inputMode === 'image' ? 'bg-white text-blue-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}
                      >
                        🖼️ Image
                      </button>

                      <button
                        onClick={() => { stopWebcamStream(); setInputMode('url'); }}
                        class={`py-2 rounded-lg text-xs font-bold transition ${inputMode === 'url' ? 'bg-white text-blue-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}
                      >
                        🌐 URL
                      </button>

                      <button
                        onClick={() => setInputMode('webcam')}
                        class={`py-2 rounded-lg text-xs font-bold transition ${inputMode === 'webcam' ? 'bg-white text-blue-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}
                      >
                        📹 Webcam
                      </button>
                    </div>

                    {/* Mode 1 & 2: File Upload (Video / Image) */}
                    {(inputMode === 'video' || inputMode === 'image') && (
                      <label class={`border-2 border-dashed rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer transition min-h-[200px] ${uploadedFile ? 'border-blue-500 bg-blue-50/50' : 'border-slate-300 hover:border-blue-500 hover:bg-slate-50'}`}>
                        <input 
                          type="file" 
                          accept={inputMode === 'image' ? 'image/*' : 'video/*'} 
                          class="hidden" 
                          onChange={handleFileChange} 
                        />
                        
                        {uploadedFile ? (
                          <div class="flex flex-col items-center space-y-2 text-center">
                            <div class="w-12 h-12 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center border border-blue-200">
                              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </div>
                            <span class="text-sm font-bold text-blue-700">{uploadedFile.name}</span>
                            <span class="text-xs text-slate-500 font-mono">{(uploadedFile.size / (1024 * 1024)).toFixed(2)} MB</span>
                            <span class="text-xs text-emerald-700 font-bold px-3 py-1 bg-emerald-100 border border-emerald-200 rounded-lg">✓ File Loaded Successfully</span>
                          </div>
                        ) : (
                          <div class="flex flex-col items-center text-center space-y-2">
                            <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center border border-slate-200">
                              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            </div>
                            <span class="text-sm font-bold text-slate-800">Drag & drop or click to browse</span>
                            <span class="text-xs text-slate-500">
                              {inputMode === 'image' ? 'Supports .jpg, .png, .webp' : 'Supports .mp4, .avi, .mov, .webm'}
                            </span>
                          </div>
                        )}
                      </label>
                    )}

                    {/* Mode 3: Direct URL */}
                    {inputMode === 'url' && (
                      <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-700 block">Direct Media URL Link</label>
                        <input
                          type="url"
                          value={mediaUrlInput}
                          onChange={(e) => setMediaUrlInput(e.target.value)}
                          placeholder="https://example.com/sample_video.mp4"
                          class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-blue-600 font-mono shadow-sm"
                        />
                      </div>
                    )}

                                    <line x1={padding} y1={svgH - padding} x2={svgW - padding} y2={svgH - padding} stroke="#cbd5e1" stroke-width="1.5" />

                                    {/* 50% Red Threshold Line */}
                                    <line x1={padding} y1={thresholdY} x2={svgW - padding} y2={thresholdY} stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" />
                                    <text x={svgW - padding - 80} y={thresholdY - 5} fill="#f43f5e" font-size="9" font-weight="bold" font-family="sans-serif">50% Threshold</text>

                                    {/* Gradient Area Fill */}
                                    <path d={areaStr} fill="url(#riskAreaGrad)" />

                                    {/* Wave Polyline */}
                                    <polyline points={polylineStr} fill="none" stroke="url(#riskLineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

                                    {/* Interactive Data Node Points */}
                                    {coords.map((c, i) => {
                                      const isSuspicious = c.pt.risk_percent >= 50.0;
                                      const isHovered = activeHoverPoint && activeHoverPoint.timestamp_sec === c.pt.timestamp_sec;

                                      return (
                                        <g key={i} class="cursor-pointer" onMouseEnter={() => setActiveHoverPoint(c.pt)} onMouseLeave={() => setActiveHoverPoint(null)}>
                                          <circle 
                                            cx={c.x} 
                                            cy={c.y} 
                                            r={isHovered ? "7" : "4.5"} 
                                            fill={isSuspicious ? "#dc2626" : "#2563eb"} 
                                            stroke="#ffffff" 
                                            stroke-width="2" 
                                            class="transition-all duration-150"
                                          />
                                          {isHovered && (
                                            <circle cx={c.x} cy={c.y} r="10" fill="none" stroke={isSuspicious ? "#f87171" : "#60a5fa"} stroke-width="2" opacity="0.8" />
                                          )}
                                        </g>
                                      );
                                    })}
                                  </svg>

                                  {/* Timeline X-Axis Labels */}
                                  <div class="flex items-center justify-between text-[10px] text-slate-500 font-mono pt-1">
                                    <span>Start ({points[0]?.timestamp_str || '00:00s'})</span>
                                    <span>Sampling Interval ({points.length} Frame Checkpoints)</span>
                                    <span>End ({points[points.length - 1]?.timestamp_str || 'End'})</span>
                                  </div>
                                </div>
                              );
                            })()}
                          </div>

                          {activeHoverPoint && (
                            <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-lg text-xs flex items-center justify-between text-blue-900">
                              <span>Hovered Timestamp: <strong>{activeHoverPoint.timestamp_str}</strong></span>
                              <span>Fraud Risk: <strong>{activeHoverPoint.risk_percent}%</strong> ({activeHoverPoint.risk_percent >= 50 ? '🚨 SUSPICIOUS' : '🟢 NORMAL'})</span>
                            </div>
                          )}
                        </div>
                      )}

                      {/* 3-Modality Scores */}
                      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        
                        <div class="white-card p-4 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-700 uppercase">1. Visual Authenticity</span>
                            <span class="text-xs font-extrabold text-blue-600">{analysisResult.video.visual_score_percent}% Fake</span>
                          </div>
                          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full transition-all" style={{ width: `${analysisResult.video.visual_score_percent}%` }}></div>
                          </div>
                          <p class="text-[11px] text-slate-500">EfficientNet-B0 visual spatial classifier.</p>
                        </div>

                        <div class="white-card p-4 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-700 uppercase">2. Speech Authenticity</span>
                            <span class="text-xs font-extrabold text-purple-600">{analysisResult.audio.audio_score_percent}% Synthetic</span>
                          </div>
                          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-purple-600 h-full transition-all" style={{ width: `${analysisResult.audio.audio_score_percent}%` }}></div>
                          </div>
                          <p class="text-[11px] text-slate-500">2D-CNN Mel-Spectrogram voice clone classifier.</p>
                        </div>

                        <div class="white-card p-4 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-700 uppercase">3. Lip-Sync Mismatch</span>
                            <span class="text-xs font-extrabold text-amber-600">{(analysisResult.sync.sync_mismatch_score * 100).toFixed(1)}% Mismatch</span>
                          </div>
                          <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-amber-600 h-full transition-all" style={{ width: `${analysisResult.sync.sync_mismatch_score * 100}%` }}></div>
                          </div>
                          <p class="text-[11px] text-slate-500">Cross-modal alignment between lips & audio envelope.</p>
                        </div>

                      </div>

                      {/* Grad-CAM Heatmaps Gallery */}
                      {analysisResult.heatmaps && analysisResult.heatmaps.length > 0 && (
                        <div class="white-card p-6 space-y-4">
                          <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-2">
                            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Explainable AI (Grad-CAM) Visual Heatmap Analysis
                          </h3>
                          <p class="text-xs text-slate-500">
                            Red/Warm activation regions highlight spatial pixel manipulation hotspots detected by EfficientNet feature maps.
                          </p>

                          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-1">
                            {analysisResult.heatmaps.map((hm, idx) => (
                              <div key={idx} class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
                                <img src={hm.data_uri} class="w-full h-36 object-contain rounded-lg border border-slate-300 bg-black" />
                                <span class="text-xs font-bold text-slate-800 block">{hm.label}</span>
                                <span class="text-[11px] text-rose-600 font-bold block">{(hm.fake_prob * 100).toFixed(1)}% Fake Prob</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Suspicious Timestamps Log Table */}
                      {analysisResult.suspicious_timestamps && analysisResult.suspicious_timestamps.length > 0 && (
                        <div class="white-card p-6 space-y-4">
                          <h3 class="text-xs font-extrabold text-amber-700 uppercase tracking-wider flex items-center gap-2">
                            <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Suspicious Timestamp Detection Log Table
                          </h3>

                          <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-700">
                              <thead class="bg-slate-100 text-[10px] uppercase text-slate-600 border-b border-slate-200">
                                <tr>
                                  <th class="py-2.5 px-3 font-bold">Interval Timestamp</th>
                                  <th class="py-2.5 px-3 font-bold">Peak Anomaly Score</th>
                                  <th class="py-2.5 px-3 font-bold">Anomaly Description</th>
                                </tr>
                              </thead>
                              <tbody class="divide-y divide-slate-200">
                                {analysisResult.suspicious_timestamps.map((ts, idx) => (
                                  <tr key={idx} class="hover:bg-slate-50">
                                    <td class="py-2.5 px-3 font-mono font-bold text-amber-700">{ts.timestamp_str}</td>
                                    <td class="py-2.5 px-3 font-black text-rose-600">{ts.risk_percent}%</td>
                                    <td class="py-2.5 px-3 text-slate-600">{ts.description}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* Analyst Decision Action */}
                      <div class="white-card p-6 space-y-4">
                        <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-2">
                          <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                          Forensic Review & Verification Action
                        </h3>

                        {analystDecision ? (
                          <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center space-y-1">
                            <span class="text-sm font-bold text-emerald-800 block">✓ Decision Recorded: {analystDecision}</span>
                            <span class="text-xs text-slate-500 block">Saved to Audit History</span>
                          </div>
                        ) : (
                          <div class="grid grid-cols-3 gap-3">
                            <button 
                              onClick={() => recordDecision('APPROVED (AUTHENTIC)')}
                              class="py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-xl font-bold text-xs transition shadow-sm"
                            >
                              Approve Verification
                            </button>
                            <button 
                              onClick={() => recordDecision('FLAGGED FOR DEEPFAKE AUDIT')}
                              class="py-3 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 rounded-xl font-bold text-xs transition shadow-sm"
                            >
                              Flag for Audit
                            </button>
                            <button 
                              onClick={() => recordDecision('REJECTED (FRAUD)')}
                              class="py-3 bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-300 rounded-xl font-bold text-xs transition shadow-sm"
                            >
                              Reject Fraud Attempt
                            </button>
                          </div>
                        )}
                      </div>
                    </>
                  ) : (
                    <div class="white-card p-12 text-center flex flex-col items-center justify-center space-y-4 min-h-[400px]">
                      <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-200">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      </div>
                      <h3 class="text-base font-bold text-slate-800">No Media Analyzed Yet</h3>
                      <p class="text-xs text-slate-500 max-w-md">
                        Upload a video, image, or enter a media URL on the left panel to run full multimodal ML detection, view Grad-CAM heatmaps, interactive risk graphs, and export PDF audit reports.
                      </p>
                    </div>
                  )}

                </div>

              </div>
            )}

            {/* TAB 2: Audit History */}
            {activeTab === 'history' && (
              <div class="space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                  <div class="white-card p-5">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">Total Audited Videos</span>
                    <span class="text-2xl font-black text-slate-900 mt-1 block">{historyRecords.length}</span>
                    <span class="text-[11px] text-blue-600 mt-1 block font-bold">Engine: {historyDbEngine} DB</span>
                  </div>

                  <div class="white-card p-5 border-emerald-200 bg-emerald-50/50">
                    <span class="text-xs font-bold text-emerald-800 uppercase tracking-wider block">Approved Verification</span>
                    <span class="text-2xl font-black text-emerald-700 mt-1 block">{approvedCount}</span>
                    <span class="text-[11px] text-emerald-600 mt-1 block font-semibold">Authentic Media Calls</span>
                  </div>

                  <div class="white-card p-5 border-amber-200 bg-amber-50/50">
                    <span class="text-xs font-bold text-amber-800 uppercase tracking-wider block">Sent for Manual Audit</span>
                    <span class="text-2xl font-black text-amber-700 mt-1 block">{auditCount}</span>
                    <span class="text-[11px] text-amber-600 mt-1 block font-semibold">Flagged Borderline Cues</span>
                  </div>

                  <div class="white-card p-5 border-rose-200 bg-rose-50/50">
                    <span class="text-xs font-bold text-rose-800 uppercase tracking-wider block">Rejected Fraud Attempts</span>
                    <span class="text-2xl font-black text-rose-700 mt-1 block">{rejectedCount}</span>
                    <span class="text-[11px] text-rose-600 mt-1 block font-semibold">Blocked Deepfake Scams</span>
                  </div>
                </div>

                <div class="white-card p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div class="flex items-center gap-2">
                    <button onClick={() => setHistoryFilter('ALL')} class={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'ALL' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>All ({historyRecords.length})</button>
                    <button onClick={() => setHistoryFilter('APPROVED')} class={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'APPROVED' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>🟢 Approved ({approvedCount})</button>
                    <button onClick={() => setHistoryFilter('AUDIT')} class={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'AUDIT' ? 'bg-amber-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>🟡 Sent for Audit ({auditCount})</button>
                    <button onClick={() => setHistoryFilter('REJECTED')} class={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${historyFilter === 'REJECTED' ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>🔴 Rejected ({rejectedCount})</button>
                  </div>

                  <div class="relative w-full sm:w-64">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search filename or request ID..."
                      class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-xl text-xs text-slate-900 focus:outline-none focus:border-blue-600 font-mono shadow-sm"
                    />
                    <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 9 0 0114 0z"></path></svg>
                  </div>
                </div>

                <div class="white-card overflow-hidden">
                  {filteredRecords.length > 0 ? (
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-xs text-slate-700">
                        <thead class="bg-slate-100 uppercase tracking-wider text-[10px] text-slate-600 border-b border-slate-200">
                          <tr>
                            <th class="py-3.5 px-4 font-bold">Timestamp</th>
                            <th class="py-3.5 px-4 font-bold">Media File</th>
                            <th class="py-3.5 px-4 font-bold">Fraud Risk</th>
                            <th class="py-3.5 px-4 font-bold">AI Prediction</th>
                            <th class="py-3.5 px-4 font-bold">Flagged Modality</th>
                            <th class="py-3.5 px-4 font-bold">Analyst Decision</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                          {filteredRecords.map((rec, idx) => {
                            const decision = rec.analyst_decision || rec.decision || 'N/A';
                            const isApprove = decision.toUpperCase().includes('APPROV');
                            const isAudit = decision.toUpperCase().includes('AUDIT') || decision.toUpperCase().includes('FLAG');
                            const isReject = decision.toUpperCase().includes('REJECT');

                            return (
                              <tr key={idx} class="hover:bg-slate-50 transition">
                                <td class="py-3.5 px-4 font-mono text-[11px] text-slate-500">{new Date(rec.timestamp).toLocaleString()}</td>
                                <td class="py-3.5 px-4 font-semibold text-slate-900">{rec.filename}<span class="block text-[10px] font-mono text-slate-500 mt-0.5">{rec.request_id}</span></td>
                                <td class="py-3.5 px-4 font-black"><span class={`px-2.5 py-1 rounded-md text-[11px] ${rec.fraud_risk_percent > 60 ? 'text-rose-700 bg-rose-100' : rec.fraud_risk_percent > 30 ? 'text-amber-700 bg-amber-100' : 'text-emerald-700 bg-emerald-100'}`}>{rec.fraud_risk_percent}%</span></td>
                                <td class="py-3.5 px-4 font-bold"><span class={`px-2 py-0.5 rounded text-[10px] uppercase ${rec.prediction === 'FAKE' ? 'bg-rose-100 text-rose-700 border border-rose-300' : rec.prediction === 'SUSPICIOUS' ? 'bg-amber-100 text-amber-700 border border-amber-300' : 'bg-emerald-100 text-emerald-700 border border-emerald-300'}`}>{rec.prediction}</span></td>
                                <td class="py-3.5 px-4 text-slate-600 max-w-xs truncate">{rec.trigger_modality}</td>
                                <td class="py-3.5 px-4"><span class={`px-3 py-1 rounded-xl text-[11px] font-bold inline-block ${isApprove ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : isAudit ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>{decision}</span></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div class="p-12 text-center space-y-3">
                      <p class="text-sm font-semibold text-slate-500">No verification records match your filter criteria.</p>
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
